<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 780" width="1380" height="780" font-family="Arial, Helvetica, sans-serif" font-size="11">
  <defs>
    <marker id="hueco" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L13,7 L0,14 z" fill="#fff" stroke="#000"/>
    </marker>
    <marker id="abierto" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#000"/>
    </marker>
  </defs>
  <rect width="1380" height="780" fill="#fff"/>
  <text x="8" y="18" font-size="12">Vista Estructural - Observer</text>

  <!-- ================= PantallaUbicacionBolsines ================= -->
  <g>
    <rect x="20" y="60" width="420" height="110" fill="#fff" stroke="#000"/>
    <text x="230" y="76" text-anchor="middle">«boundary»</text>
    <text x="230" y="92" text-anchor="middle" font-weight="bold">PantallaUbicacionBolsines</text>
    <line x1="20" y1="100" x2="440" y2="100" stroke="#000"/>
    <text x="26" y="116">- gestor: GestorUbicacionBolsines</text>
    <line x1="20" y1="126" x2="440" y2="126" stroke="#000"/>
    <text x="26" y="142">+ tomarConfirmacionEnvioCorreo(confirma: boolean): void</text>
    <text x="26" y="158">+ informarNotificacionExitosa(numeroBolsin: Integer, emailGCM: String): void</text>
  </g>

  <!-- ================= GestorUbicacionBolsines ================= -->
  <g>
    <rect x="490" y="60" width="430" height="274" fill="#fff" stroke="#000"/>
    <text x="705" y="76" text-anchor="middle">«control»</text>
    <text x="705" y="92" text-anchor="middle" font-weight="bold">GestorUbicacionBolsines</text>
    <line x1="490" y1="100" x2="920" y2="100" stroke="#000"/>
    <text x="496" y="116">- pantalla: PantallaUbicacionBolsines</text>
    <text x="496" y="132">- bolsinSeleccionado: Bolsin</text>
    <text x="496" y="148">- emailGCM: String</text>
    <text x="496" y="164">- ubicacionBolsinSeleccionado: UbicacionBolsin</text>
    <text x="496" y="180">- observadores: IObservadorBolsines[]</text>
    <line x1="490" y1="190" x2="920" y2="190" stroke="#000"/>
    <text x="496" y="206">+ tomarConfirmacionEnvioCorreo(confirma: boolean): void</text>
    <text x="496" y="222">- buscarEmail(): String</text>
    <text x="496" y="238">- llamarCasoDeUso31NotificarUbicacionBolsines(emailGCM: String): void</text>
    <text x="496" y="254">- suscribirObservadores(): void</text>
    <text x="496" y="270">+ suscribir(observadores: IObservadorBolsines[]): void</text>
    <text x="496" y="286">+ quitar(observador: IObservadorBolsines): void</text>
    <text x="496" y="302">+ notificar(): void</text>
    <text x="496" y="318">- finCU(): void</text>
  </g>

  <!-- ================= ISujetoBolsines ================= -->
  <g transform="translate(40,0)">
    <rect x="970" y="60" width="350" height="102" fill="#fff" stroke="#000"/>
    <text x="1145" y="76" text-anchor="middle">«interface»</text>
    <text x="1145" y="92" text-anchor="middle" font-weight="bold" font-style="italic">ISujetoBolsines</text>
    <line x1="970" y1="100" x2="1320" y2="100" stroke="#000"/>
    <text x="976" y="116" font-style="italic">+ suscribir(observadores: IObservadorBolsines[]): void</text>
    <text x="976" y="132" font-style="italic">+ quitar(observador: IObservadorBolsines): void</text>
    <text x="976" y="148" font-style="italic">+ notificar(): void</text>
  </g>

  <!-- ================= IObservadorBolsines ================= -->
  <g transform="translate(40,0)">
    <rect x="970" y="300" width="350" height="86" fill="#fff" stroke="#000"/>
    <text x="1145" y="316" text-anchor="middle">«interface»</text>
    <text x="1145" y="332" text-anchor="middle" font-weight="bold" font-style="italic">IObservadorBolsines</text>
    <line x1="970" y1="340" x2="1320" y2="340" stroke="#000"/>
    <text x="976" y="356" font-style="italic">+ actualizar(bolsin: Bolsin, emailGCM: String,</text>
    <text x="976" y="372" font-style="italic">        ubicacion: UbicacionBolsin): void</text>
  </g>

  <!-- ================= InterfazNotificacionEmail ================= -->
  <g transform="translate(40,0)">
    <rect x="970" y="470" width="350" height="110" fill="#fff" stroke="#000"/>
    <text x="1145" y="486" text-anchor="middle">«boundary»</text>
    <text x="1145" y="502" text-anchor="middle" font-weight="bold">InterfazNotificacionEmail</text>
    <line x1="970" y1="510" x2="1320" y2="510" stroke="#000"/>
    <line x1="970" y1="518" x2="1320" y2="518" stroke="#000"/>
    <text x="976" y="534">+ actualizar(bolsin: Bolsin, emailGCM: String,</text>
    <text x="976" y="550">        ubicacion: UbicacionBolsin): void</text>
    <text x="976" y="566">+ enviarNotificacion(notificacion: String): void</text>
  </g>

  <!-- ================= Bolsin ================= -->
  <g>
    <rect x="20" y="300" width="300" height="136" fill="#fff" stroke="#000"/>
    <text x="170" y="316" text-anchor="middle">«entity»</text>
    <text x="170" y="332" text-anchor="middle" font-weight="bold">Bolsin</text>
    <line x1="20" y1="340" x2="320" y2="340" stroke="#000"/>
    <text x="26" y="356">- numeroBolsin: Integer</text>
    <text x="26" y="372">- numeroPrecinto: Integer</text>
    <text x="26" y="388">- modeloGPSTracker: String</text>
    <line x1="20" y1="396" x2="320" y2="396" stroke="#000"/>
    <text x="26" y="412">+ getNumeroBolsin(): Integer</text>
    <text x="26" y="428">+ getCMDestino(): ComisionMedica</text>
  </g>

  <!-- ================= UbicacionBolsin ================= -->
  <g>
    <rect x="20" y="500" width="300" height="120" fill="#fff" stroke="#000"/>
    <text x="170" y="516" text-anchor="middle">«record»</text>
    <text x="170" y="532" text-anchor="middle" font-weight="bold">UbicacionBolsin</text>
    <line x1="20" y1="540" x2="320" y2="540" stroke="#000"/>
    <text x="26" y="556">- numeroBolsin: Integer</text>
    <text x="26" y="572">- latitud: Double</text>
    <text x="26" y="588">- longitud: Double</text>
    <text x="26" y="604">- fechaHoraUltimaActualizacion: LocalDateTime</text>
    <line x1="20" y1="612" x2="320" y2="612" stroke="#000"/>
  </g>

  <!-- ================= Empleado ================= -->
  <g>
    <rect x="490" y="430" width="260" height="142" fill="#fff" stroke="#000"/>
    <text x="620" y="446" text-anchor="middle">«entity»</text>
    <text x="620" y="462" text-anchor="middle" font-weight="bold">Empleado</text>
    <line x1="490" y1="470" x2="750" y2="470" stroke="#000"/>
    <text x="496" y="486">- nombre: String</text>
    <text x="496" y="502">- apellido: String</text>
    <text x="496" y="518">- email: String</text>
    <line x1="490" y1="526" x2="750" y2="526" stroke="#000"/>
    <text x="496" y="542">+ sosGCM(): boolean</text>
    <text x="496" y="558">+ getEmail(): String</text>
  </g>

  <!-- ================= Rol ================= -->
  <g>
    <rect x="490" y="650" width="260" height="104" fill="#fff" stroke="#000"/>
    <text x="620" y="666" text-anchor="middle">«entity»</text>
    <text x="620" y="682" text-anchor="middle" font-weight="bold">Rol</text>
    <line x1="490" y1="690" x2="750" y2="690" stroke="#000"/>
    <text x="496" y="706">- nombre: String</text>
    <text x="496" y="722">- descripcion: String</text>
    <line x1="490" y1="730" x2="750" y2="730" stroke="#000"/>
    <text x="496" y="746">+ esTuGCM(): boolean</text>
  </g>

  <!-- ================= Relaciones ================= -->
  <!-- Pantalla <-> Gestor -->
  <line x1="440" y1="85" x2="489" y2="85" stroke="#000" marker-end="url(#abierto)"/>
  <text x="446" y="80" font-size="10">-gestor 1</text>
  <line x1="490" y1="145" x2="441" y2="145" stroke="#000" marker-end="url(#abierto)"/>
  <text x="446" y="140" font-size="10">-pantalla 1</text>

  <!-- Gestor realiza ISujetoBolsines -->
  <line x1="920" y1="110" x2="1010" y2="110" stroke="#000" stroke-dasharray="6,4" marker-end="url(#hueco)"/>

  <!-- Gestor -> IObservadorBolsines (observadores 0..*) -->
  <line x1="920" y1="320" x2="1009" y2="320" stroke="#000" marker-end="url(#abierto)"/>
  <text x="926" y="314" font-size="10">-observadores</text>
  <text x="980" y="334" font-size="10">0..*</text>

  <!-- InterfazNotificacionEmail realiza IObservadorBolsines -->
  <line x1="1185" y1="470" x2="1185" y2="386" stroke="#000" stroke-dasharray="6,4" marker-end="url(#hueco)"/>

  <!-- Gestor crea InterfazNotificacionEmail -->
  <path d="M880,334 V525 H1009" fill="none" stroke="#000" stroke-dasharray="6,4" marker-end="url(#abierto)"/>
  <text x="890" y="518" font-size="10">«create»</text>

  <!-- Gestor -> Bolsin -->
  <path d="M490,250 H170 V299" fill="none" stroke="#000" marker-end="url(#abierto)"/>
  <text x="176" y="292" font-size="10">-bolsinSeleccionado 1</text>

  <!-- Gestor -> UbicacionBolsin -->
  <path d="M490,300 H400 V560 H321" fill="none" stroke="#000" marker-end="url(#abierto)"/>
  <text x="326" y="554" font-size="10">-ubicacionBolsinSeleccionado</text>
  <text x="380" y="574" font-size="10">1</text>

  <!-- Gestor usa Empleado (buscarEmail) -->
  <line x1="620" y1="334" x2="620" y2="429" stroke="#000" stroke-dasharray="6,4" marker-end="url(#abierto)"/>
  <text x="626" y="390" font-size="10">«use»</text>

  <!-- Empleado -> Rol -->
  <line x1="620" y1="572" x2="620" y2="649" stroke="#000" marker-end="url(#abierto)"/>
  <text x="626" y="640" font-size="10">-rol 1</text>
</svg>
