# ===== Aplicación CU 36 =====
# La API mock de GPS de la cátedra usa el 8080, por eso esta app corre en el 8081
server.port=8081
spring.application.name=bolsines-cu36

# ===== Base de datos H2 (archivo en ./data) =====
spring.datasource.url=jdbc:h2:file:./data/bolsines;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Consola web de H2 para mostrar la persistencia en la defensa: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== GPS Trackers (API mock: https://github.com/LiberaeMentis/dsi-api-bolsines) =====
gps.url-base=http://localhost:8080
